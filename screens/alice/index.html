<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alice — Screen Control</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #111; color: #fff; height: 100vh; display: flex; flex-direction: column; }
  .control-bar {
    height: 48px; background: #1a1a2e; display: flex; align-items: center; padding: 0 16px; gap: 12px;
    border-bottom: 2px solid #0f3460; flex-shrink: 0;
  }
  .user-label { font-weight: 700; font-size: 15px; margin-right: 8px; color: #e94560; }
  .btn {
    padding: 6px 14px; border: 1px solid #333; border-radius: 6px; background: #222;
    color: #ccc; font-size: 13px; cursor: pointer; transition: all 0.15s;
  }
  .btn:hover { background: #333; color: #fff; }
  .btn.active { background: #0f3460; border-color: #e94560; color: #fff; }
  iframe { flex: 1; width: 100%; border: none; }
</style>
</head>
<body>
  <div class="control-bar">
    <span class="user-label">Alice</span>
    <button class="btn" data-state="focus_work">VS Code</button>
    <button class="btn" data-state="available">YouTube</button>
    <button class="btn" data-state="in_meeting">Zoom</button>
  </div>
  <iframe id="screen" src="focus_work.html"></iframe>

  <script>
    const GATEWAY = 'http://localhost:8080';
    const USER = 'Alice';
    const buttons = document.querySelectorAll('.btn');
    const iframe = document.getElementById('screen');

    function setActive(state) {
      buttons.forEach(b => b.classList.toggle('active', b.dataset.state === state));
      iframe.src = state + '.html';
    }

    buttons.forEach(btn => {
      btn.addEventListener('click', async () => {
        const state = btn.dataset.state;
        setActive(state);
        try {
          await fetch(`${GATEWAY}/set-screen/${USER}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ state }),
          });
        } catch (e) { console.error('Failed to set screen:', e); }
      });
    });

    // Sync with backend on load
    (async () => {
      try {
        const resp = await fetch(`${GATEWAY}/screen-states`);
        const states = await resp.json();
        if (states[USER]) setActive(states[USER]);
      } catch (e) { console.error('Failed to fetch screen states:', e); }
    })();
  </script>
</body>
</html>

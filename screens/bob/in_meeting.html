<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, height=720">
<title>Zoom Meeting - Sprint Planning</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; background: #1a1a1a; color: #fff; width: 1280px; height: 720px; overflow: hidden; display: flex; flex-direction: column; }

  /* Top bar */
  .topbar { height: 40px; background: #232323; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #333; z-index: 10; }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-left .shield { width: 16px; height: 16px; background: #2d8e3c; border-radius: 3px; display: flex; align-items: center; justify-content: center; }
  .topbar-left .shield::after { content: ''; width: 6px; height: 6px; border: 1.5px solid #fff; border-radius: 50%; }
  .topbar-title { font-size: 13px; color: #e0e0e0; font-weight: 500; }
  .topbar-center { display: flex; align-items: center; gap: 16px; }
  .meeting-id { font-size: 12px; color: #888; }
  .recording { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #e04040; }
  .rec-dot { width: 8px; height: 8px; background: #e04040; border-radius: 50%; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .timer { font-size: 13px; color: #ccc; font-variant-numeric: tabular-nums; }
  .participants-count { font-size: 12px; color: #888; background: #333; padding: 2px 8px; border-radius: 10px; }

  /* Video grid area */
  .video-area { flex: 1; display: flex; padding: 8px; gap: 8px; background: #1a1a1a; overflow: hidden; }

  /* Speaker view: main speaker large on left, sidebar on right */
  .speaker-main { flex: 1; display: flex; flex-direction: column; }
  .speaker-sidebar { width: 240px; display: flex; flex-direction: column; gap: 8px; }

  /* Video tile */
  .tile { border-radius: 8px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .tile-main { flex: 1; }
  .tile-side { height: calc(33.33% - 6px); }

  .tile-bg { position: absolute; inset: 0; }
  .tile-initials { font-size: 48px; font-weight: 600; color: rgba(255,255,255,0.85); z-index: 2; text-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .tile-side .tile-initials { font-size: 28px; }

  .tile-label { position: absolute; bottom: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: linear-gradient(transparent, rgba(0,0,0,0.6)); z-index: 3; }
  .tile-name { font-size: 12px; color: #fff; font-weight: 500; }
  .tile-side .tile-name { font-size: 11px; }
  .tile-mic { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
  .tile-side .tile-mic { width: 14px; height: 14px; }
  .mic-on { color: #4ade80; }
  .mic-off { color: #ef4444; }

  /* Speaking indicator */
  .tile-speaking { border: 2px solid #4ade80; }

  /* Gradient backgrounds for each participant */
  .bg-bob { background: linear-gradient(135deg, #1a3a5a 0%, #2870a8 50%, #1a3a5a 100%); }
  .bg-diana { background: linear-gradient(135deg, #4a2040 0%, #7a3068 50%, #4a2040 100%); }
  .bg-grace { background: linear-gradient(135deg, #3a2050 0%, #6a3888 50%, #3a2050 100%); }
  .bg-hank { background: linear-gradient(135deg, #2a3a1a 0%, #4a6830 50%, #2a3a1a 100%); }

  /* Bottom control bar */
  .controls { height: 60px; background: #232323; display: flex; align-items: center; justify-content: center; gap: 4px; border-top: 1px solid #333; }
  .ctrl-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 16px; border-radius: 8px; cursor: pointer; border: none; background: transparent; color: #d0d0d0; font-size: 10px; min-width: 64px; }
  .ctrl-btn:hover { background: #333; }
  .ctrl-btn svg { width: 22px; height: 22px; }
  .ctrl-btn .label { font-size: 10px; color: #999; }
  .ctrl-btn.active svg { color: #4ade80; }
  .ctrl-btn.end { background: #e04040; border-radius: 20px; padding: 6px 20px; }
  .ctrl-btn.end:hover { background: #c03030; }
  .ctrl-btn.end .label { color: #fff; }
  .ctrl-btn.muted svg { color: #ef4444; }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-left">
    <div class="shield"></div>
    <span class="topbar-title">Sprint Planning</span>
  </div>
  <div class="topbar-center">
    <span class="meeting-id">Meeting ID: 931-504-7782</span>
    <div class="recording">
      <div class="rec-dot"></div>
      <span>Recording</span>
    </div>
  </div>
  <div class="topbar-right">
    <span class="timer">00:14:22</span>
    <span class="participants-count">4 participants</span>
  </div>
</div>

<!-- Video Grid - Speaker View -->
<div class="video-area">
  <!-- Main speaker: Bob (highlighted) -->
  <div class="speaker-main">
    <div class="tile tile-main tile-speaking bg-bob">
      <div class="tile-bg bg-bob"></div>
      <span class="tile-initials">BS</span>
      <div class="tile-label">
        <span class="tile-name">Bob Smith (You)</span>
        <div class="tile-mic mic-on">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Sidebar: other participants -->
  <div class="speaker-sidebar">
    <div class="tile tile-side bg-diana">
      <div class="tile-bg bg-diana"></div>
      <span class="tile-initials">DL</span>
      <div class="tile-label">
        <span class="tile-name">Diana Lee</span>
        <div class="tile-mic mic-on">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </div>
      </div>
    </div>
    <div class="tile tile-side bg-grace">
      <div class="tile-bg bg-grace"></div>
      <span class="tile-initials">GP</span>
      <div class="tile-label">
        <span class="tile-name">Grace Park</span>
        <div class="tile-mic mic-off">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2c0 .76-.13 1.49-.35 2.17"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </div>
      </div>
    </div>
    <div class="tile tile-side bg-hank">
      <div class="tile-bg bg-hank"></div>
      <span class="tile-initials">HT</span>
      <div class="tile-label">
        <span class="tile-name">Hank Torres</span>
        <div class="tile-mic mic-off">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2c0 .76-.13 1.49-.35 2.17"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bottom Control Bar -->
<div class="controls">
  <div class="ctrl-btn active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    <span class="label">Mute</span>
  </div>
  <div class="ctrl-btn active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
    <span class="label">Video</span>
  </div>
  <div class="ctrl-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    <span class="label">Share Screen</span>
  </div>
  <div class="ctrl-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span class="label">Chat</span>
  </div>
  <div class="ctrl-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    <span class="label">Participants</span>
  </div>
  <div class="ctrl-btn end">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/><line x1="23" y1="1" x2="1" y2="23"/></svg>
    <span class="label">End</span>
  </div>
</div>

</body>
</html>

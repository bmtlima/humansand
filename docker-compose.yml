services:
  # --- Simulated user screens (nginx serving static HTML) ---
  screen-alice:
    build:
      context: ./screens
      args:
        USER_DIR: alice
    ports:
      - "6001:80"
    networks:
      - linkmate

  screen-bob:
    build:
      context: ./screens
      args:
        USER_DIR: bob
    ports:
      - "6002:80"
    networks:
      - linkmate

  screen-charlie:
    build:
      context: ./screens
      args:
        USER_DIR: charlie
    ports:
      - "6003:80"
    networks:
      - linkmate

  screen-diana:
    build:
      context: ./screens
      args:
        USER_DIR: diana
    ports:
      - "6004:80"
    networks:
      - linkmate

  # --- Screenshot service (Playwright) ---
  screenshot-svc:
    build:
      context: ./backend
      dockerfile: Dockerfile.screenshot
    ports:
      - "7777:7000"
    environment:
      - SCREEN_ALICE_URL=http://screen-alice:80
      - SCREEN_BOB_URL=http://screen-bob:80
      - SCREEN_CHARLIE_URL=http://screen-charlie:80
      - SCREEN_DIANA_URL=http://screen-diana:80
    depends_on:
      - screen-alice
      - screen-bob
      - screen-charlie
      - screen-diana
    networks:
      - linkmate

  # --- Registry ---
  registry:
    build:
      context: ./backend
      dockerfile: Dockerfile.agent
    command: python3 -m uvicorn registry:app --host 0.0.0.0 --port 8000 --log-level warning
    ports:
      - "8000:8000"
    environment:
      - AGENT_ALICE_URL=http://agent-alice:8001
      - AGENT_BOB_URL=http://agent-bob:8002
      - AGENT_CHARLIE_URL=http://agent-charlie:8003
      - AGENT_DIANA_URL=http://agent-diana:8004
    networks:
      - linkmate

  # --- Agents ---
  agent-alice:
    build:
      context: ./backend
      dockerfile: Dockerfile.agent
    command: python3 base_agent.py --user-name Alice --port 8001
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    environment:
      - SCREENSHOT_SERVICE_URL=http://screenshot-svc:7000
      - REGISTRY_URL=http://registry:8000
      - AGENT_ALICE_URL=http://agent-alice:8001
      - AGENT_BOB_URL=http://agent-bob:8002
      - AGENT_CHARLIE_URL=http://agent-charlie:8003
      - AGENT_DIANA_URL=http://agent-diana:8004
    depends_on:
      - registry
      - screenshot-svc
    networks:
      - linkmate

  agent-bob:
    build:
      context: ./backend
      dockerfile: Dockerfile.agent
    command: python3 base_agent.py --user-name Bob --port 8002
    ports:
      - "8002:8002"
    env_file:
      - ./backend/.env
    environment:
      - SCREENSHOT_SERVICE_URL=http://screenshot-svc:7000
      - REGISTRY_URL=http://registry:8000
      - AGENT_ALICE_URL=http://agent-alice:8001
      - AGENT_BOB_URL=http://agent-bob:8002
      - AGENT_CHARLIE_URL=http://agent-charlie:8003
      - AGENT_DIANA_URL=http://agent-diana:8004
    depends_on:
      - registry
      - screenshot-svc
    networks:
      - linkmate

  agent-charlie:
    build:
      context: ./backend
      dockerfile: Dockerfile.agent
    command: python3 base_agent.py --user-name Charlie --port 8003
    ports:
      - "8003:8003"
    env_file:
      - ./backend/.env
    environment:
      - SCREENSHOT_SERVICE_URL=http://screenshot-svc:7000
      - REGISTRY_URL=http://registry:8000
      - AGENT_ALICE_URL=http://agent-alice:8001
      - AGENT_BOB_URL=http://agent-bob:8002
      - AGENT_CHARLIE_URL=http://agent-charlie:8003
      - AGENT_DIANA_URL=http://agent-diana:8004
    depends_on:
      - registry
      - screenshot-svc
    networks:
      - linkmate

  agent-diana:
    build:
      context: ./backend
      dockerfile: Dockerfile.agent
    command: python3 base_agent.py --user-name Diana --port 8004
    ports:
      - "8004:8004"
    env_file:
      - ./backend/.env
    environment:
      - SCREENSHOT_SERVICE_URL=http://screenshot-svc:7000
      - REGISTRY_URL=http://registry:8000
      - AGENT_ALICE_URL=http://agent-alice:8001
      - AGENT_BOB_URL=http://agent-bob:8002
      - AGENT_CHARLIE_URL=http://agent-charlie:8003
      - AGENT_DIANA_URL=http://agent-diana:8004
    depends_on:
      - registry
      - screenshot-svc
    networks:
      - linkmate

  # --- API Gateway ---
  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile.agent
    command: python3 api_gateway.py
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - AGENT_ALICE_URL=http://agent-alice:8001
      - AGENT_BOB_URL=http://agent-bob:8002
      - AGENT_CHARLIE_URL=http://agent-charlie:8003
      - AGENT_DIANA_URL=http://agent-diana:8004
      - REGISTRY_URL=http://registry:8000
      - SCREENSHOT_SERVICE_URL=http://screenshot-svc:7000
    depends_on:
      - agent-alice
      - agent-bob
      - agent-charlie
      - agent-diana
    networks:
      - linkmate

  # --- Frontend ---
  frontend:
    build:
      context: ./frontend
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - gateway
    networks:
      - linkmate

networks:
  linkmate:
    driver: bridge
